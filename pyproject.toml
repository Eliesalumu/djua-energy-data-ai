[project]
name = "djua-energy-data-ai"
version = "0.1.0"
description = "Plateforme Data & AI pour Djua Energy en phase de structuration"
authors = [{ name = "Data & AI Team" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.4.0",
  "joblib>=1.4.0",
  "pytest>=8.3.0",
  "openai>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]